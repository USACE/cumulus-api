openapi: 3.0.2
info:
  title: Cumulus REST API
  version: 2.0.0
  description: Realtime processing engine and REST API to support hydrologic modeling
  contact:
    name: Cumulus API Support
    url: 'https://github.com/USACE/cumulus/issues'
servers:
  - url: 'https://cumulus.cwbi.mil/api'
    description: GovCloud Production API
  - url: 'https://cumulus-test.cwbi.us/api'
    description: GovCloud Test API
  - url: 'https://cumulus.dev.cwbi.us/api'
    description: GovCloud Development API
  - url: 'http://localhost/api'
    description: Local Development API
components:
  schemas:
    acquirable:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    acquirables:
      type: array
      items:
        $ref: '#/components/schemas/acquirable'
    acquirablefile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        datetime:
          type: string
          format: date-time
        file:
          type: string
        create_date:
          type: string
          format: date-time
        process_date:
          type: string
          format: date-time
        acquirable_id:
          type: string
          format: uuid
    acquirablefiles:
      type: array
      items:
        $ref: '#/components/schemas/acquirablefile'
    empty_object:
      type: object
    download:
      type: object
      x-examples:
        example-1:
          id: 497f6eca-6276-4993-bfeb-53cbbbba6f08
          sub: 753487e7-10bc-4e69-b3b2-4da33721ea3e
          datetime_start: '2020-12-01T01:00:00Z'
          datetime_end: '2020-12-15T01:00:00Z'
          watershed_id: 94e7713a-ccd6-432d-b2f0-972422511171
          product_id:
            - 64756f41-75e2-40ce-b91a-fda5aeb441fc
          status_id: 4e949624-bc0f-439e-a9f2-25a23938812c
          status: SUCCESS
          progress: 100
          file: 'https://cumulus.cwbi.mil/api/cumulus/download/path/to/file.dss'
          processing_start: '2022-03-01T14:15:22Z'
          processing_end: '2022-03-01T14:45:50Z'
          watershed_slug: genesee-river
          watershed_name: Genesee River
      properties:
        id:
          type: string
          format: uuid
        sub:
          type: string
          format: uuid
        datetime_start:
          type: string
          format: date-time
        datetime_end:
          type: string
          format: date-time
        watershed_id:
          type: string
          format: uuid
          nullable: true
        product_id:
          type: array
          items:
            type: string
            format: uuid
        status_id:
          type: string
          format: uuid
        status:
          type: string
        progress:
          type: integer
        file:
          type: string
          nullable: true
        processing_start:
          type: string
          format: date-time
        processing_end:
          type: string
          format: date-time
          nullable: true
        watershed_slug:
          type: string
          nullable: true
        watershed_name:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        clip_geojson:
          type: string
          nullable: true
        clip_region_name:
          type: string
          nullable: true
        clip_bbox:
          type: array
          items:
            type: number
          nullable: true
        clip_name:
          type: string
          nullable: true
    downloadRequest:
      type: object
      x-examples:
        download-request-example:
          datetime_start: '2020-12-01T01:00:00Z'
          datetime_end: '2019-08-24T14:15:22Z'
          watershed_id: 94e7713a-ccd6-432d-b2f0-972422511171
          product_id:
            - 64756f41-75e2-40ce-b91a-fda5aeb441fc
      properties:
        datetime_start:
          type: string
          format: date-time
          default: '2020-12-01T01:00:00Z'
        datetime_end:
          type: string
          format: date-time
          default: '2020-12-15T01:00:00Z'
        watershed_id:
          type: string
          minLength: 1
          default: 94e7713a-ccd6-432d-b2f0-972422511171
        product_id:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
            default: 64756f41-75e2-40ce-b91a-fda5aeb441fc
        format:
          type: string
          description: Output format (e.g. dss7)
        clip_geojson:
          type: string
          description: GeoJSON string to clip results
        clip_region_name:
          type: string
          description: Name of the clip region
      required:
        - datetime_start
        - datetime_end
        - product_id
    dssDatatype:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    dssDatatypes:
      type: array
      items:
        $ref: '#/components/schemas/dssDatatype'
    product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        tags:
          type: array
          items:
            type: string
            format: uuid
        temporal_resolution:
          type: integer
        temporal_duration:
          type: integer
        dss_datatype:
          type: string
        dss_fpart:
          type: string
        parameter_id:
          type: string
          format: uuid
        parameter:
          type: string
        unit_id:
          type: string
          format: uuid
        unit:
          type: string
        description:
          type: string
        suite_id:
          type: string
          format: uuid
        suite:
          type: string
        label:
          type: string
        after:
          type: string
          format: date-time
          nullable: true
        before:
          type: string
          format: date-time
          nullable: true
        productfile_count:
          type: integer
        last_forecast_version:
          type: string
          format: date-time
          nullable: true
    products:
      type: array
      items:
        $ref: '#/components/schemas/product'
    productfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        datetime:
          type: string
          format: date-time
        file:
          type: string
        version:
          type: string
          format: date-time
          nullable: true
    productfiles:
      type: array
      items:
        $ref: '#/components/schemas/productfile'
    productStatus:
      type: object
      properties:
        slug:
          type: string
        latest_product_datetime:
          type: string
          format: date-time
          nullable: true
        acceptable_timedelta:
          type: string
          nullable: true
        actual_timedelta:
          type: string
          nullable: true
        is_current:
          type: boolean
    productFileAvailability:
      type: object
      properties:
        datetime:
          type: string
          format: date-time
        is_available:
          type: boolean
    tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        color:
          type: string
    tags:
      type: array
      items:
        $ref: '#/components/schemas/tag'
    suite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
    suites:
      type: array
      items:
        $ref: '#/components/schemas/suite'
    unit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        abbreviation:
          type: string
    units:
      type: array
      items:
        $ref: '#/components/schemas/unit'
    parameter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    parameters:
      type: array
      items:
        $ref: '#/components/schemas/parameter'
    office:
      type: object
      properties:
        id:
          type: string
          format: uuid
        symbol:
          type: string
        name:
          type: string
    offices:
      type: array
      items:
        $ref: '#/components/schemas/office'
    userRegion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sub:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        geojson:
          type: object
        bbox:
          type: array
          items:
            type: number
        area_sqkm:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        is_public:
          type: boolean
        tags:
          type: array
          items:
            type: string
        usage_count:
          type: integer
    userRegionInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        geojson:
          type: object
        is_public:
          type: boolean
        tags:
          type: array
          items:
            type: string
      required:
        - name
        - geojson
  examples:
    createProductRequest:
      value:
        name: NOHRSC Snodas SWE
        temporal_resolution: 86400
        temporal_duration: 0
        dss_datatype_id: 392f8984-2e4e-47ea-ae24-dad81d87f662
        dss_fpart: SNODAS
        parameter_id: 683a55b9-4a94-46b5-9f47-26e66f3037a8
        unit_id: e245d39f-3209-4e58-bfb7-4eae94b3f8dd
        description: Snow Water Equivalent dataset produced by NOHRSC
    createProductResponse:
      value:
        id: 757c809c-dda0-412b-9831-cb9bd0f62d1d
        slug: nohrsc-snodas-swe
        tags: []
        name: NOHRSC Snodas SWE
        temporal_resolution: 86400
        temporal_duration: 0
        dss_datatype: INST-VAL
        dss_fpart: SNODAS
        parameter_id: 683a55b9-4a94-46b5-9f47-26e66f3037a8
        parameter: SWE
        unit_id: e245d39f-3209-4e58-bfb7-4eae94b3f8dd
        unit: MM
        description: Snow Water Equivalent dataset produced by NOHRSC
    productExample:
      value:
        id: 757c809c-dda0-412b-9831-cb9bd0f62d1d
        slug: nohrsc-snodas-swe
        tags:
          - 57bda84f-ecec-4cd7-b3b1-c0c36f838a05
        name: NOHRSC Snodas SWE
        temporal_resolution: 86400
        temporal_duration: 0
        dss_datatype: INST-VAL
        dss_fpart: SNODAS
        parameter_id: 683a55b9-4a94-46b5-9f47-26e66f3037a8
        parameter: SWE
        unit_id: e245d39f-3209-4e58-bfb7-4eae94b3f8dd
        unit: MM
        description: Snow Water Equivalent dataset produced by NOHRSC
    productfileExample:
      value:
        id: 951d8838-75ac-4250-ad48-4cdb249484b2
        datetime: '2021-03-21T01:00:00-05:00'
        file: cumulus/nohrsc_snodas_swe/zz_ssmv11034tS__T0001TTNATS2021032105HP001_cloud_optimized.tif
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      description: ''
    API-Key:
      name: key
      type: apiKey
      in: query
      description: Internal Use Only
x-tagGroups:
  - name: System
    tags:
      - System
  - name: Products
    tags:
      - Acquirables
      - Products
      - Suites
      - Tags
      - Units
      - Parameters
      - DSS
      - Offices
  - name: Downloads
    tags:
      - Downloads
      - My Downloads
      - Metrics
  - name: Watersheds
    tags:
      - Watersheds
      - My Watersheds
  - name: Regions
    tags:
      - User Regions
paths:
  /health:
    get:
      tags:
        - System
      summary: Health Check
      description: Returns the health status and version of the API
      responses:
        '200':
          description: Health Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
      operationId: health-check
  /identity-provider/configuration:
    get:
      tags:
        - System
      summary: Identity Provider Configuration
      description: Returns Keycloak OIDC endpoints for the current auth environment
      responses:
        '200':
          description: Identity Provider Configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  token_endpoint:
                    type: string
                  well_known_endpoint:
                    type: string
      operationId: get-identity-provider-configuration
  /acquirables:
    get:
      tags:
        - Acquirables
      summary: List Acquirables
      description: List all acquirables
      responses:
        '200':
          description: Array of Acquirables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/acquirables'
      operationId: list-acquirables
  /acquirablefiles:
    post:
      tags:
        - Acquirables
      summary: Create Acquirable File
      description: Create database record of an acquirablefile
      responses:
        '201':
          description: Acquirable File
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/acquirablefile'
      operationId: post-acquirable-file
      security:
        - Bearer: []
        - API-Key: []
      x-internal: true
  '/acquirables/{acquirable_id}/files':
    get:
      tags:
        - Acquirables
      summary: List Acquirable Files
      description: List Acquirable Files for a single Acquirable within a specified date range
      parameters:
        - name: acquirable_id
          in: path
          required: true
          description: The ID of the acquirable
          schema:
            type: string
            format: uuid
        - schema:
            type: string
            default: '2022-03-01'
          in: query
          name: after
          required: true
          description: After this date
        - schema:
            type: string
            default: '2022-03-05'
          in: query
          name: before
          required: true
          description: Before this date
      responses:
        '200':
          description: List of Acquirable Files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/acquirablefiles'
      operationId: list-acquirable-files
      security:
        - Bearer: []
    parameters:
      - schema:
          type: string
          format: uuid
          example: 64756f41-75e2-40ce-b91a-fda5aeb441fc
          default: 64756f41-75e2-40ce-b91a-fda5aeb441fc
        name: acquirable_id
        in: path
        required: true
        description: Acquirable UUID
  /offices:
    get:
      tags:
        - Offices
      summary: List Offices
      description: List all offices
      responses:
        '200':
          description: Array of Offices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/offices'
      operationId: list-offices
  /dss/datatypes:
    get:
      tags:
        - DSS
      summary: List DSS Datatypes
      description: List DSS Datatypes
      responses:
        '200':
          description: Array of DSS Datatypes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dssDatatypes'
      operationId: list-dss-datatypes
  /products:
    get:
      tags:
        - Products
      description: List Products
      responses:
        '200':
          description: Array of Products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/products'
      operationId: list-products
      summary: List All Products
    post:
      tags:
        - Products
      description: Create Product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                temporal_resolution:
                  type: integer
                temporal_duration:
                  type: integer
                dss_datatype_id:
                  type: string
                  format: uuid
                dss_fpart:
                  type: string
                parameter_id:
                  type: string
                  format: uuid
                unit_id:
                  type: string
                  format: uuid
            examples:
              example-request:
                value:
                  name: string
                  temporal_resolution: 0
                  temporal_duration: 0
                  dss_datatype_id: 392f8984-2e4e-47ea-ae24-dad81d87f662
                  dss_fpart: string
                  parameter_id: d4531ae7-3de2-4d63-ad99-c60ad3103820
                  unit_id: 5becc822-b69e-4e66-a762-ad8e868dcab6
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/product'
              examples:
                response-body-example:
                  value:
                    id: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                    slug: string
                    name: string
                    tags:
                      - 497f6eca-6276-4993-bfeb-53cbbbba6f08
                    temporal_resolution: 0
                    temporal_duration: 0
                    dss_datatype: string
                    dss_fpart: string
                    parameter_id: d4531ae7-3de2-4d63-ad99-c60ad3103820
                    parameter: string
                    unit_id: 5becc822-b69e-4e66-a762-ad8e868dcab6
                    unit: string
                    description: string
      operationId: create-product
      security:
        - Bearer: []
      summary: Create New Product
  '/products/{product_id}':
    parameters:
      - name: product_id
        in: path
        required: true
        description: The ID of the product to update or delete
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Products
      description: Get Product
      responses:
        '200':
          description: A Single Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/product'
              example:
                $ref: '#/components/examples/productExample'
      operationId: get-product
      summary: Get Single Product
    put:
      tags:
        - Products
      description: Update Product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/product'
      responses:
        '200':
          description: A Single Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/product'
              example:
                $ref: '#/components/examples/productExample'
      operationId: update-product
      security:
        - Bearer: []
      summary: Update Single Product
    delete:
      tags:
        - Products
      description: Delete Product
      responses:
        '200':
          description: Empty Object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/empty_object'
      operationId: delete-product
      security:
        - Bearer: []
      summary: Delete Product
  '/products/{product_id}/undelete':
    parameters:
      - name: product_id
        in: path
        required: true
        description: ID of Product to Undelete
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Products
      description: Undo Product Delete
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/product'
              example:
                $ref: '#/components/examples/productExample'
      operationId: undo-delete-product
      security:
        - Bearer: []
  '/products/{product_id}/files':
    get:
      tags:
        - Products
      summary: List Productfiles
      description: List Productfiles for a single product within a specified date range
      parameters:
        - name: product_id
          in: path
          required: true
          description: The ID of the product
          schema:
            type: string
            format: uuid
        - name: after
          in: query
          schema:
            type: string
            format: date-time
          required: true
        - name: before
          in: query
          schema:
            type: string
            format: date-time
          required: true
      responses:
        '200':
          description: List of Productfiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/productfiles'
      operationId: list-product-files
  '/products/{product_id}/availability':
    get:
      tags:
        - Products
      summary: Get Product Availability
      description: Get file count by day for a single product
      parameters:
        - name: product_id
          in: path
          required: true
          description: The ID of the product
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product Availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  product_id:
                    type: string
                    format: uuid
                  date_counts:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date-time
                        count:
                          type: integer
      operationId: get-product-availability
    parameters:
      - schema:
          type: string
          format: uuid
          example: 64756f41-75e2-40ce-b91a-fda5aeb441fc
          default: 64756f41-75e2-40ce-b91a-fda5aeb441fc
        name: product_id
        in: path
        required: true
        description: Product UUID
  '/products/{product_id}/file-availability':
    get:
      tags:
        - Products
      summary: Get Product File Availability
      description: Get file availability for a single product
      parameters:
        - name: product_id
          in: path
          required: true
          description: The ID of the product
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product File Availability
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/productFileAvailability'
      operationId: get-product-file-availability
    parameters:
      - schema:
          type: string
          format: uuid
        name: product_id
        in: path
        required: true
        description: Product UUID
  /product_ingest_status:
    get:
      tags:
        - Products
      summary: Get Product Ingest Status
      description: Get the ingest status for all products
      responses:
        '200':
          description: Array of Product Ingest Statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/productStatus'
      operationId: get-product-ingest-status
  /product_slugs:
    get:
      tags:
        - Products
      summary: Get Product Slugs
      description: Get a list of all product slugs
      responses:
        '200':
          description: Array of Product Slugs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    slug:
                      type: string
      operationId: get-product-slugs
  /productfiles:
    post:
      tags:
        - Products
      summary: Create Productfiles
      description: Create productfile records
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/productfile'
      operationId: create-productfiles
      security:
        - Bearer: []
      x-internal: true
  /suites:
    get:
      tags:
        - Suites
      summary: List Suites
      description: List all product suites
      responses:
        '200':
          description: Array of Suites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/suites'
      operationId: list-suites
    post:
      tags:
        - Suites
      summary: Create Suite
      description: Create a new product suite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/suite'
